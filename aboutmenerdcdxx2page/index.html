<!-- Tells the browser this is a modern HTML5 document -->
<!DOCTYPE html>

<!-- Root element; lang tells browsers/screen readers this page is English -->
<html lang="en">

<!-- The <head> holds info ABOUT the page (not shown on the page itself) -->
<head>
    <!-- Sets character encoding so special characters display correctly -->
    <meta charset="UTF-8">
    <!-- Makes the page resize properly on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown in the browser tab -->
    <title>About Me</title>
</head>

<!-- The <body> holds everything the visitor actually SEES -->
<body>

    <!-- div = divider tag; used here to group the nav bar into one container -->
    <div>
        <!-- h2 header inside the nav bar showing the page title -->
        <h2>About Me</h2>
        <!-- a = anchor tag; href points to the Hobbies page (must be in the same folder) -->
        <a href="myHobbies.html">My Hobbies</a>
        <!-- a tag linking to the Favorite Eats page -->
        <a href="myFavoriteEats.html">My Favorite Eats</a>
    </div>

    <!-- h2 header tag displaying your name — replace # with your name -->
    <h2>menerdcdxx/h2>

    <!-- h2 header tag displaying your age — replace # with your age -->
    <h2>40something</h2>

    <!-- img tag displays a picture; src = file path to your photo, alt = backup text if it fails to load -->
    <img src="#" alt="A photo of me" width="400">

    <!-- p tag = paragraph; short summary about who you are — replace # with your summary -->
    <p>#</p>

</body>
</html>
