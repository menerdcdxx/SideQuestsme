<!-- Tells the browser this is a modern HTML5 document -->
<!DOCTYPE html>

<!-- Root element; lang tells browsers/screen readers this page is English -->
<html lang="en">

<!-- The <head> holds info ABOUT the page (not shown on the page itself) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Eats</title>
</head>

<body>

    <!-- Same nav bar as the other pages, so visitors can navigate from any page -->
    <div>
        <h2>About Me</h2>
        <a href="index.html">Home</a>
        <a href="myHobbies.html">My Hobbies</a>
    </div>

    <!-- ol = ordered-list tag; holds all 3 favorite-food list-items -->
    <ol>

        <!-- li = list-item tag; one for each food (Food #1) -->
        <li>
            <!-- h3 header tag with the food's name — replace # -->
            <h3>#</h3>
            <!-- img tag showing a picture of the food — replace # with the image file path -->
            <img src="#" alt="Food 1" width="300">
        </li>

        <!-- li tag (Food #2) -->
        <li>
            <h3>#</h3>
            <img src="#" alt="Food 2" width="300">
        </li>

        <!-- li tag (Food #3) -->
        <li>
            <h3>#</h3>
            <img src="#" alt="Food 3" width="300">
        </li>

    </ol>

</body>
</html>
