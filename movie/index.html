<!-- the illusion continues -->
<!-- Tells the browser this is a modern HTML5 document -->
<!DOCTYPE html>

<!-- The root element that wraps the entire page; lang tells browsers/screen readers it's English -->
<html lang="en">

<!-- The <head> holds info ABOUT the page (not shown on the page itself) -->
<head>
    <!-- Sets character encoding so special characters display correctly -->
    <meta charset="UTF-8">
    <!-- Makes the page resize properly on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown in the browser tab -->
    <title>My Favorite Movies and a favorite hentai*** </title>
</head>

<!-- The <body> holds everything the visitor actually SEES -->
<body>

    <!-- h1 = header tag; displays the page title as required -->
    <h1>My favorite Movies</h1>

    <!-- table tag starts the table that will hold all 3 movies -->
    <table border="1" cellpadding="8">

        <!-- tr = table row; this row is the header row labeling each column -->
        <tr>
            <!-- td = table data cell; used here just to label the column "Title" -->
            <td><strong>Title</strong></td>
            <!-- labels the "Release Year" column -->
            <td><strong>Release Year</strong></td>
            <!-- labels the "Trailer" column -->
            <td><strong>Trailer</strong></td>
        </tr>

        <!-- Row 1: Terminator -->
        <tr>
            <!-- td holds the movie title -->
            <td>The Terminator</td>
            <!-- td holds the release year -->
            <td>1984</td>
            <!-- td holds an anchor (a) tag linking to the trailer -->
            <td><a href="https://www.youtube.com/watch?v=k64P4l2Wmeg" target="_blank">Watch Trailer</a></td>
        </tr>

        <!-- Row 2: A Nightmare on Elm Street (features Freddy Krueger) -->
        <tr>
            <td>A Nightmare on Elm Street</td>
            <td>1984</td>
            <td><a href="https://www.youtube.com/watch?v=MrbfWZLxGEs" target="_blank">Watch Trailer</a></td>
        </tr>

        <!-- Row 3: La Blue Girl -->
        <tr>
            <td>La Blue Girl</td>
            <td>1989</td>
            <!-- nongraphis sceene (hentai) anime,
                 so replace the # below with whatever trailer link you choose to use -->
            <td><a href="https://www.youtube.com/watch?v=BK-DPNO6zfY" target="_blank">Watch Trailer</a></td>
        </tr>

    </table>

</body>
</html>
